name: Actualizar Ventaja Local

on:
  # Cada hora: los resultados aparecen en la fuente al poco de acabar el
  # partido, así que con esta frecuencia la web los refleja dentro de la hora
  # siguiente. Se pide en el minuto 20 y no en punto porque a esa hora hay
  # menos cola en los servidores de GitHub y la tarea arranca antes.
  schedule:
    - cron: "20 * * * *"

  # También en cuanto tú cambies algo: editas la plantilla o los textos, haces
  # push y la web se regenera y se publica sola en unos minutos.
  push:
    branches: [main]
    paths:
      - "web/plantilla.html"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/actualizar.yml"

  # Y a mano, desde la pestaña Actions del repositorio.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Una sola ejecución a la vez. Sin esto, el disparo por push y el del reloj
  # coincidían y las dos intentaban escribir en el repositorio.
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar datos y regenerar la web
        # El token sube el límite de la API de GitHub de 60 peticiones por hora
        # a 5.000, que es lo que hace falta para leer el repositorio de escudos.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Clave de football-data.org, guardada como secreto del repositorio.
          # Si no existe, el programa lo detecta y sigue sin esa fuente.
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python scripts/actualizar.py

      - name: Guardar los datos nuevos en el repositorio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/datos_ligas.json web/index.html
          git add datos/*.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos: no se genera commit."
          else
            git commit -m "Datos actualizados $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Otro push puede haber llegado mientras corría el trabajo: el tuyo,
            # o el de otra ejecución del propio robot si dos coinciden. Se
            # reintegra y se reintenta, porque el primero en llegar hace que el
            # segundo sea rechazado y eso tumbaba la publicación entera.
            for intento in 1 2 3; do
              git pull --rebase --autostash origin main || true
              if git push; then
                echo "Subido en el intento $intento"
                break
              fi
              echo "Rechazado; se reintenta"
              sleep 8
            done
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
